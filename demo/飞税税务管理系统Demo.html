<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飞效OA管理系统 · 离线演示</title>
<style>
/* 飞税税务管理系统 · 样式 */
:root {
  --pri: #0f766e;
  --pri-d: #0b5d57;
  --bg: #f3f6f7;
  --card: #fff;
  --line: #e2e9ea;
  --txt: #1c2b2d;
  --sub: #74858a;
  --ok: #16a34a;
  --warn: #d99b0b;
  --err: #cf2f4b;
  --side: #132a2c;
  --side-2: #1d3b3e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--txt);
  background: var(--bg);
  overflow-x: hidden;
}
a { color: var(--pri); text-decoration: none; }

/* ---------- 侧边栏 ---------- */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 200px;
  background: var(--side); color: #c8d6d7; display: flex; flex-direction: column;
  z-index: 20;
}
.brand {
  padding: 18px 18px 4px; font-size: 18px; font-weight: 700; color: #fff;
  letter-spacing: 1px;
}
.brand-sub { padding: 0 18px 14px; font-size: 11.5px; color: #7d9598; }
#nav { flex: 1; overflow-y: auto; padding: 4px 8px; }
#nav a {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin: 1px 0;
  color: #bccfd0; border-radius: 7px; font-size: 13.5px; position: relative;
}
#nav a .ic { width: 18px; text-align: center; font-size: 14px; }
#nav a:hover { background: var(--side-2); color: #fff; }
#nav a.on { background: var(--pri); color: #fff; }
#nav a .badge {
  margin-left: auto; background: var(--err); color: #fff; font-size: 11px;
  min-width: 18px; height: 18px; line-height: 18px; text-align: center;
  border-radius: 9px; padding: 0 5px; font-weight: 600;
}
#nav a.on .badge { background: rgba(255,255,255,.28); }
.side-foot {
  padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08);
  font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.side-foot span { color: #8ba3a6; flex: 1; min-width: 80px; }

/* ---------- 主区 ---------- */
#main {
  margin-left: 200px; padding: 20px 24px 48px; min-height: 100vh;
}
h2.page { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
.page-desc { color: var(--sub); font-size: 12.5px; margin-bottom: 14px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px;
}
.card h3 {
  margin: 0 0 12px; font-size: 14.5px; font-weight: 650; display: flex;
  align-items: center; gap: 8px;
}
.card h3 .sub { font-weight: 400; font-size: 12px; color: var(--sub); margin-left: auto; }

/* ---------- KPI ---------- */
.kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 18px; min-width: 130px; flex: 1;
}
.kpi b { display: block; font-size: 23px; font-weight: 700; line-height: 1.25; }
.kpi span { font-size: 12.5px; color: var(--sub); }
.kpi.ok b { color: var(--ok); }
.kpi.warn b { color: var(--warn); }
.kpi.err b { color: var(--err); }
.kpi.pri b { color: var(--pri); }

/* ---------- 工具条 ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn {
  border: 0; background: var(--pri); color: #fff; padding: 7px 14px;
  border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.btn:hover { background: var(--pri-d); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: #eaf0f1; color: var(--txt); }
.btn.ghost:hover { background: #dfe8e9; }
.btn.danger { background: var(--err); }
.btn.ok { background: var(--ok); }
.btn.sm { padding: 4px 10px; font-size: 12px; }

input, select, textarea {
  font-family: inherit; font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 7px; background: #fff;
  color: var(--txt); outline: none; max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--pri); }
textarea { resize: vertical; min-height: 84px; width: 100%; }

/* ---------- 表格 ---------- */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { color: var(--sub); font-weight: 600; font-size: 12.5px; background: #f9fbfb; }
tbody tr:hover { background: #f6faf9; }
tr.click { cursor: pointer; }
td.wrap { white-space: normal; min-width: 180px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.tag {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
  background: #eaf0f1; color: var(--sub);
}
.tag.ok { background: #e6f7ec; color: var(--ok); }
.tag.warn { background: #fff5e0; color: var(--warn); }
.tag.err { background: #fdedf0; color: var(--err); }
.tag.pri { background: #e3f4f2; color: var(--pri); }

.empty { color: var(--sub); text-align: center; padding: 44px 12px; font-size: 13px; }

/* ---------- 表单 ---------- */
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; }
.fld input, .fld select, .fld textarea { width: 100%; }
.fld i { display: block; font-size: 11.5px; color: var(--sub); font-style: normal; margin-top: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }

/* ---------- 进度条 ---------- */
.bar { background: #eaf0f1; border-radius: 5px; height: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pri); border-radius: 5px; }
.bar i.warn { background: var(--warn); }
.bar i.err { background: var(--err); }
.bar i.ok { background: var(--ok); }

/* ---------- 竖向柱状图 ---------- */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 6px 0 0; }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
  align-items: center; gap: 4px; min-width: 0; }
.chart .col .bars { display: flex; gap: 3px; align-items: flex-end; height: 150px; }
.chart .col .bars i { width: 14px; border-radius: 3px 3px 0 0; background: var(--pri);
  display: block; min-height: 2px; }
.chart .col .bars i.b2 { background: #9ecfc9; }
.chart .col .lb { font-size: 11.5px; color: var(--sub); white-space: nowrap; }
.chart .col .vv { font-size: 11px; color: var(--txt); }

/* ---------- 横向条形排行 ---------- */
.rank { display: flex; flex-direction: column; gap: 9px; }
.rank .r { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.rank .r .n { width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .r .b { flex: 1; }
.rank .r .v { width: 96px; text-align: right; color: var(--sub);
  font-variant-numeric: tabular-nums; }

/* ---------- 时间线 ---------- */
.tl { position: relative; padding-left: 22px; }
.tl:before {
  content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
  width: 2px; background: var(--line);
}
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item:before {
  content: ''; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff; border: 2px solid var(--pri);
}
.tl-item.pass:before { border-color: var(--ok); }
.tl-item.reject:before { border-color: var(--err); }
.tl-item .t { font-size: 11.5px; color: var(--sub); }
.tl-item .h { font-weight: 600; font-size: 13.5px; margin: 1px 0; }
.tl-item .d { color: var(--sub); font-size: 12.5px; }

/* ---------- 风险卡片 ---------- */
.risk-list { display: flex; flex-direction: column; gap: 10px; }
.risk-item {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: 9px; padding: 12px 16px;
}
.risk-item.lv-hi { border-left-color: var(--err); }
.risk-item.lv-mid { border-left-color: var(--warn); }
.risk-item.lv-lo { border-left-color: #9ecfc9; }
.risk-item .h { display: flex; align-items: center; gap: 8px; }
.risk-item .h b { font-size: 13.5px; }
.risk-item .d { color: var(--sub); font-size: 12.5px; margin: 4px 0 0; }

/* ---------- 税率卡 ---------- */
.rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.rate-card {
  border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; background: #fff;
}
.rate-card b { display: block; font-size: 20px; color: var(--pri); }
.rate-card span { font-size: 12px; color: var(--sub); }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 28, 30, .45); z-index: 60;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  overflow-y: auto;
}
.modal {
  background: #fff; border-radius: 12px; padding: 20px 22px; width: 520px;
  max-width: 100%; box-shadow: 0 16px 48px rgba(0,0,0,.22);
}
.modal.wide { width: 800px; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.hidden { display: none !important; }

.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
  background: #1c2b2d; color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 90; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  max-width: 80vw;
}

/* ---------- 结算卡 ---------- */
.settle {
  background: linear-gradient(135deg, #0f766e, #14958a); color: #fff;
  border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
}
.settle .row { display: flex; gap: 26px; flex-wrap: wrap; }
.settle .row > div b { display: block; font-size: 21px; font-weight: 700; }
.settle .row > div span { font-size: 12px; opacity: .82; }
.settle .note { margin-top: 10px; font-size: 12px; opacity: .85; }

/* ---------- 登录页 ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #132a2c 0%, #1d4a48 52%, #0f766e 130%);
  padding: 20px;
}
.login-box {
  background: #fff; border-radius: 14px; padding: 34px 32px; width: 372px;
  max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.login-box h1 { font-size: 21px; margin: 0 0 4px; }
.login-box p { color: var(--sub); font-size: 12.5px; margin: 0 0 22px; }
.login-box input { width: 100%; margin-bottom: 12px; padding: 10px 12px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 14px; margin-top: 6px; }
.hint { font-size: 11.5px; color: var(--sub); text-align: center; margin-top: 14px;
  line-height: 1.8; }

/* ---------- 移动端 ---------- */
@media (max-width: 820px) {
  #sidebar {
    position: static; width: auto; flex-direction: row; align-items: center;
    overflow-x: auto; padding: 0 8px;
  }
  .brand { padding: 10px 8px; font-size: 15px; white-space: nowrap; }
  .brand-sub { display: none; }
  #nav { display: flex; padding: 6px 0; flex: 1; }
  #nav a { white-space: nowrap; padding: 6px 10px; }
  #nav a .ic { display: none; }
  .side-foot { border: 0; padding: 6px; }
  .side-foot span { display: none; }
  #main { margin-left: 0; padding: 14px 12px 40px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .kpi b { font-size: 20px; }
  .chart { height: 160px; }
  .chart .col .bars { height: 120px; }
}


.demo-bar{position:fixed;left:0;right:0;top:0;z-index:99;background:#fff8e6;color:#7a5b12;
  border-bottom:1px solid #f0d9a8;font-size:12.5px;padding:7px 16px;text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.demo-bar b{color:#b8791b}
.demo-bar .who{margin-left:12px;padding-left:12px;border-left:1px solid #f0d9a8}
.demo-bar select{font-size:12.5px;padding:2px 6px;border:1px solid #e0c98f;border-radius:4px;
  background:#fff;color:#7a5b12}
body{padding-top:34px}

</style>
</head>

门公告","effect_date":"2023-01-01","expire_date":"2027-12-31","summary":"小型微利企业 5% 实际税负；六税两费减半","content":"一、对小型微利企业年应纳税所得额不超过 300 万元的部分，减按 25% 计算应纳税所得额，按 20% 的税率缴纳企业所得税。二、对增值税小规模纳税人、小型微利企业和个体工商户减半征收资源税（不含水资源税）、城市维护建设税、房产税、城镇土地使用税、印花税（不含证券交易印花税）、耕地占用税和教育费附加、地方教育附加。五、小型微利企业须同时符合：年度应纳税所得额≤300 万元、从业人数≤300 人、资产总额≤5000 万元。","tags":"小型微利,六税两费,减半","status":"有效","created_at":"2026-01-05 09:00:00"},{"id":5,"title":"中华人民共和国印花税法","doc_no":"主席令第八十九号","tax_type":"印花税","category":"法律","effect_date":"2022-07-01","expire_date":"","summary":"4 税目 17 子目 5 档比例税率","content":"税目税率：借款合同万分之零点五；融资租赁合同万分之零点五；买卖合同万分之三；承揽合同万分之三；建设工程合同万分之三；运输合同万分之三；技术合同万分之三；租赁合同千分之一；保管合同千分之一；仓储合同千分之一；财产保险合同千分之一；土地使用权出让书据万分之五；不动产转让书据万分之五；股权转让书据万分之五；知识产权转让书据万分之三；营业账簿万分之二点五；证券交易千分之一。第五条 计税依据为合同所列金额，不包括列明的增值税税款。","tags":"印花税,税目,税率","status":"有效","created_at":"2026-01-05 09:00:00"},{"id":6,"title":"中华人民共和国企业所得税法","doc_no":"主席令第六十三号","tax_type":"企业所得税","category":"法律","effect_date":"2008-01-01","expire_date":"","summary":"法定税率 25%，高新 15%，小微实际 5%","content":"第四条 企业所得税的税率为 25%。第二十八条 国家需要重点扶持的高新技术企业，减按 15% 的税率征收企业所得税。符合条件的小型微利企业，减按 20% 的税率征收企业所得税。","tags":"企业所得税,税率,高新","status":"有效","created_at":"2026-01-05 09:00:00"},{"id":8,"title":"中华人民共和国城镇土地使用税暂行条例","doc_no":"国务院令第 483 号","tax_type":"城镇土地使用税","category":"行政法规","effect_date":"2007-01-01","expire_date":"","summary":"分级幅度税额 1.5~30 元/㎡·年","content":"第四条 土地使用税每平方米年税额：大城市 1.5 元至 30 元；中等城市 1.2 元至 24 元；小城市 0.9 元至 18 元；县城、建制镇、工矿区 0.6 元至 12 元。","tags":"土地使用税,分级,税额","status":"有效","created_at":"2026-01-05 09:00:00"},{"id":7,"title":"中华人民共和国房产税暂行条例","doc_no":"国发〔1986〕90 号","tax_type":"房产税","category":"行政法规","effect_date":"1986-10-01","expire_date":"","summary":"从价 1.2% / 从租 12%","content":"第三条 房产税依照房产原值一次减除 10% 至 30% 后的余值计算缴纳，税率为 1.2%；房产出租的，以房产租金收入为房产税的计税依据，税率为 12%。","tags":"房产税,从价,从租","status":"有效","created_at":"2026-01-05 09:00:00"}],"total":8},"/api/policies/1":{"id":1,"title":"中华人民共和国增值税法","doc_no":"主席令第四十一号","tax_type":"增值税","category":"法律","effect_date":"2026-01-01","expire function normPath(p) {
  p = String(p || '').replace(PREFIX, '');
  if (p.charAt(0) !== '/') p = '/' + p;
  return p;
}
function lookup(p) {
  p = normPath(p);
  if (p === '/api/auth/me') return DEMO_ME;
  if (SNAP[p] !== undefined && SNAP[p] !== null) return SNAP[p];
  var bare = p.split('?')[0];
  if (SNAP[bare] !== undefined && SNAP[bare] !== null) return SNAP[bare];
  /* 带筛选参数的列表：回退到无参数版本 */
  var m = p.match(/^\/api\/invoices\?/);
  if (m) return SNAP['/api/invoices?kind=' + encodeURIComponent('\u9500\u9879')]
    || (SNAP['/api/invoices?kind=' + encodeURIComponent('\u8fdb\u9879')] || {});
  m = p.match(/^\/api\/declarations\?/);
  if (m) return SNAP['/api/declarations'] || {};
  m = p.match(/^\/api\/risks\?/);
  if (m) return SNAP['/api/risks'] || {};
  m = p.match(/^\/api\/policies\?/);
  if (m) return SNAP['/api/policies'] || {};
  /* 详情：/api/invoices/XX0001 */
  m = p.match(/^\/api\/invoices\/([\w\-]+)$/);
  if (m) {
    var hit = ((SNAP['/api/invoices?kind=' + encodeURIComponent('\u9500\u9879')] || {}).list || [])
      .concat((SNAP['/api/invoices?kind=' + encodeURIComponent('\u8fdb\u9879')] || {}).list || [])
      .filter(function (x) { return x.no === m[1]; })[0];
    if (hit) return Object.assign({}, hit, {risks: []});
  }
  m = p.match(/^\/api\/declarations\/([\w\-]+)$/);
  if (m) {
    var dd = ((SNAP['/api/declarations'] || {}).list || [])
      .filter(function (x) { return x.no === m[1]; })[0];
    if (dd) return Object.assign({}, dd, {vouchers: []});
  }
  m = p.match(/^\/api\/entities\/([\w\-]+)$/);
  if (m) {
    var ee = ((SNAP['/api/entities'] || {}).list || [])
      .filter(function (x) { return x.code === m[1]; })[0];
    if (ee) return Object.assign({}, ee, {stats: {period: '2026-10',
      outputTax: 0, inputTax: 0, vatPayable: 0, invoices: 0, declarations: 0}});
  }
  return null;
}

window.fetch = function (url, opt) {
  var method = (opt && opt.method) || 'GET';
  var path = String(url).replace(location.origin, '');
  var status = 200, body;
  if (method !== 'GET') {
    body = {code: 200, message: '\u6f14\u793a\u73af\u5883\u53ea\u8bfb\uff0c\u5199\u64cd\u4f5c\u672a\u6267\u884c',
            data: {}};
  } else {
    var data = lookup(path);
    if (data === null || data === undefined) {
      body = {code: 200, message: 'ok', data: []};
    } else {
      body = {code: 200, message: 'ok', data: data};
    }
  }
  return Promise.resolve({
    status: status, ok: true,
    json: function () { return Promise.resolve(body); },
    text: function () { return Promise.resolve(JSON.stringify(body)); }
  });
};

var TOKEN = localStorage.getItem('tax_token') || '';
var ME = JSON.parse(localStorage.getItem('tax_user') || '{}');
var PERMS = ME.perms || [];

function api(method, path, body, raw) {
  return fetch(PREFIX + path, {
    method: method,
    headers: Object.assign({'Content-Type': 'application/json'},
      TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}),
    body: method === 'POST' ? JSON.stringify(body || {}) : undefined
  }).then(function (r) {
    if (r.status === 401) { localStorage.clear(); location.href = 'login.html'; throw new Error('unauth'); }
    if (r.status >= 400) {
      return r.text().then(function (t) {
        var msg = 'HTTP ' + r.status;
        try { msg = (JSON.parse(t) || {}).message || msg; } catch (e) { /* 非 JSON */ }
        throw new Error(msg);
      });
    }
    return raw ? r.text() : r.json();
  }).then(function (j) {
    if (raw) return j;
    if (j && j.code && j.code !== 200) throw new Error(j.message || ('错误 ' + j.code));
    return j;
  });
}
function GET(p) { return api('GET', p); }
function POST(p, b) { return api('POST', p, b); }
function CSV(p) { return api('GET', p, null, true); }

function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? '#cf2f4b' : '#1c2b2d';
  t.classList.remove('hidden');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.classList.add('hidden'); }, 2600);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
  });
}
function perm(p) { return PERMS.indexOf('*') >= 0 || PERMS.indexOf(p) >= 0; }

/* ---------- 格式化 ---------- */
function fmtMoney(n, noSym) {
  if (n == null || n === '') return '—';
  var v = Number(n);
  var s = Math.abs(v) >= 10000
    ? v.toLocaleString('zh-CN', {maximumFractionDigits: 2})
    : v.toFixed(2);
  return (noSym ? '' : '¥') + s;
}
function fmtWan(n) {
  if (n == null || n === '') return '—';
  var v = Number(n);
  if (Math.abs(v) >= 100000000) return (v / 100000000).toFixed(2) + ' 亿';
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(2) + ' 万';
  return v.toFixed(2);
}
function fmtPct(x, digits) {
  if (x == null || x === '') return '—';
  return Number(x).toFixed(digits == null ? 2 : digits) + '%';
}
function fmtRate(r) {
  if (r == null || r === '') return '—';
  var v = Number(r);
  if (isNaN(v)) return String(r);
  if (v < 1) return (v * 100).toFixed(2).replace(/\.?0+$/, '') + '%';
  return v.toFixed(2) + '%';
}
function fmtDate(s) { return s ? String(s).slice(0, 10) : '—'; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

    document.getElementById('btn-logout').onclick = function () {
      POST('/api/auth/logout').then(function () {

      }).catch(function () { localStorage.clear(); location.href = 'login.html'; });
    };

    // 未读风险角标
    if (perm('risk.read')) {
      GET('/api/dashboard').then(function (d) {
        var n = ((d.data || {}).kpi || {}).riskOpen || 0;
        if (!n) return;
        var a = document.querySelector('#nav a[data-k="risk"]');
        if (a) a.insertAdjacentHTML('beforeend', '<b class="badge">' + n + '</b>');
      }).catch(function () {});
    }
  }).catch(function (e) {
    if (e.message !== 'unauth') location.href = 'login.html';
  });
}

var CUR = null;
function go(key) {
  CUR = key;
  if (location.hash !== '#/' + key) location.hash = '#/' + key;
  document.querySelectorAll('#nav a').forEach(function (a) {
    a.classList.toggle('on', a.getAttribute('data-k') === key);
  });
  var main = document.getElementById('main');
  main.innerHTML = '<div class="empty">加载中…</div>';
  var task;
  try {
    task = PAGES[key](main);
  } catch (e) {
    task = Promise.reject(e);
  }
  Promise.resolve(task).catch(function (e) {
    if (e && e.message === 'unauth') return;
    main.innerHTML = '<div class="empty">加载失败：' + esc(e && e.message) + '</div>';
  });
}

function modal(html, wide) {
  var mask = document.getElementById('modal-mask');
  var box = document.getElementById('modal');
  box.innerHTML = html;
  box.className = 'modal' + (wide ? ' wide' : '');
  mask.classList.remove('hidden');
  mask.onclick = function (e) { if (e.target === mask) closeModal(); };
}
function closeModal() {
  document.getElementById('modal-mask').classList.add('hidden');
}

function table(headers, rows, rowHtml, empty) {
  if (!rows || !rows.length) return '<div class="empty">' + (empty || '暂无数据') + '</div>';
  return '<div class="tw"><table><thead><tr>' + headers.map(function (h) {
    if (h && h.charAt(0) === '~') return '<th class="num">' + h.slice(1) + '</th>';
    return '<th>' + h + '</th>';
  }).join('') + '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table></div>';
}

function tag(text, cls) {
  return '<span class="tag ' + (cls || '') + '">' + esc(text) + '</span>';
}
function statusTag(s) {
  var m = {'已申报': 'ok', '已缴款': 'ok', '待申报': 'warn', '草稿': '',
           '正常': 'ok', '作废': 'err', '已作废': 'err', '已红冲': 'err',
           '已认证': 'ok', '未认证': 'warn', '已转出': 'err',
           '待处理': 'err', '已处理': 'ok', '已忽略': '',
           '启用': 'ok', '停用': '', '通过': 'ok', '驳回': 'err'};
  return tag(s, m[s] || '');
}
function levelTag(l) {
  var m = {'险': 'err', '警': 'warn', '提': 'pri', '高': 'err', '中': 'warn', '低': 'pri'};
  return tag(l, m[l] || '');
}
function kpi(v, label, cls) {
  return '<div class="kpi ' + (cls || '') + '"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
}
function field(label, input, hint) {
  return '<label class="fld"><span>' + esc(label) + '</span>' + input +
    (hint ? '<i>' + esc(hint) + '</i>' : '') + '</label>';
}
function bar(pct, cls) {
  var w = Math.max(0, Math.min(100, pct));
  return '<div class="bar"><i class="' + (cls || '') + '" style="width:' + w + '%"></i></div>';
}
function dl(p, name) {
  CSV(p).then(function (t) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type: 'text/csv;charset=utf-8'}));
    a.download = name || 'export.csv';
    a.click();
  }).catch(function (e) { toast(e.message, true); });
}

/* 期间下拉：近 12 个月滚动 */
function periodOptions(sel, n) {
  n = n || 12;
  var out = [], d = new Date();
  d.setDate(1);
  for (var i = 0; i < n; i++) {
    var p = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    out.push('<option value="' + p + '"' + (p === sel ? ' selected' : '') + '>' + p + '</option>');
    d.setMonth(d.getMonth() - 1);
  }
  return out.join('');
}

/* 竖向双柱图 */
function barChart(rows, labelKey, series, opts) {
  opts = opts || {};
  if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
  var max = 0;
  rows.forEach(function (r) {
    series.forEach(function (s) {
      max = Math.max(max, Math.abs(Number(r[s.key]) || 0));
    });
  });
  if (!max) max = 1;
  return '<div class="chart">' + rows.map(function (r) {
    var bars = series.map(function (s, i) {
      var v = Math.abs(Number(r[s.key]) || 0);
      var h = Math.max(2, Math.round(v / max * 148));
      return '<i class="' + (i ? 'b2' : '') + '" style="height:' + h + 'px" title="' +
        esc(s.name) + ' ' + fmtWan(v) + '"></i>';
    }).join('');
    return '<div class="col"><div class="vv">' + fmtWan(Number(r[series[0].key]) || 0) +
      '</div><div class="bars">' + bars + '</div><div class="lb">' +
      esc(String(r[labelKey]).slice(2)) + '</div></div>';
  }).join('') + '</div>' +
    '<div class="toolbar" style="margin-top:6px;font-size:12px;color:var(--sub)">' +
    series.map(function (s, i) {
      return '<span style="display:inline-flex;align-items:center;gap:5px">' +
        '<i style="width:10px;height:10px;border-radius:2px;display:inline-block;background:' +
        (i ? '#9ecfc9' : 'var(--pri)') + '"></i>' + esc(s.name) + '</span>';
    }).join('') + '</div>';
}

/* 横向排行 */
function rankList(rows, labelKey, valKey, money) {
  if (!rows || !rows.length) return '<div class="empty">暂无数据</div>';
  var max = 0;
  rows.forEach(function (r) { max = Math.max(max, Math.abs(Number(r[valKey]) || 0)); });
  if (!max) max = 1;
  return '<div class="rank">' + rows.map(function (r) {
    var v = Number(r[valKey]) || 0;
    return '<div class="r"><span class="n" title="' + esc(r[labelKey]) + '">' +
      esc(r[labelKey]) + '</span><span class="b">' + bar(Math.abs(v) / max * 100) +
      '</span><span class="v">' + (money === false ? fmtWan(v) : fmtMoney(v)) + '</span></div>';
  }).join('') + '</div>';
}

</script>
<script>
/* 飞税税务管理系统 · 业务页面 */

var PAGES = {};
var TAX_TYPES = ['增值税', '附加税费', '企业所得税', '个人所得税', '印花税',
                 '房产税', '城镇土地使用税', '其他税费'];

function pageHead(title, desc, acts) {
  return '<h2 class="page">' + esc(title) + '</h2>' +
    '<div class="page-desc">' + esc(desc) + '</div>' +
    (acts ? '<div class="toolbar">' + acts + '</div>' : '');
}

/* ==================================================== 工作台 */
PAGES.dash = function (el) {
  return Promise.all([GET('/api/dashboard'), GET('/api/notices')]).then(function (rs) {
    var d = rs[0].data || {}, k = d.kpi || {};

    el.innerHTML = pageHead('工作台', '当前期间 ' + d.period + ' · 全集团税务运行总览') +

      kpi(fmtWan(k.vatPayable), '应纳增值税', k.vatPayable > 0 ? 'warn' : 'ok') +
      kpi(fmtWan(k.declared), '申报税额') +
      kpi(fmtWan(k.unpaid), '待缴税额', k.unpaid > 0 ? 'err' : 'ok') +
      kpi(k.pendingCount + ' / ' + k.overdueCount, '待申报 / 逾期',
        k.overdueCount > 0 ? 'err' : 'warn') +
      kpi(k.riskOpen, '待处理风险', k.riskHigh > 0 ? 'err' : 'warn') +
      '</div>' +
      '<div class="card"><h3>近 6 期税负趋势<span class="sub">销项 / 进项 / 实缴</span></h3>' +
      barChart(d.trend || [], 'period',
        [{key: 'output', name: '销项'}, {key: 'total', name: '申报税额'}]) +
      '</div>' +
      '<div class="grid2">' +
      '<div class="card"><h3>本期税额构成</h3>' +
      ((d.byType || []).length
        ? rankList(d.byType, 'name', 'amount')
        : '<div class="empty">本期暂无申报数据</div>') +
      '</div>' +
      '<div class="card"><h3>待办申报<span class="sub">' + ((d.pending || []).length) +
      ' 项</span></h3>' +
      ((d.pending || []).length
        ? '<div class="tw"><table><thead><tr><th>单号</th><th>税种</th><th>期限</th><th class="num">税额</th></tr></thead><tbody>' +
          d.pending.map(function (p) {
            var late = p.due_date && p.due_date < todayStr();
            return '<tr class="click" data-no="' + esc(p.no) + '"><td>' + esc(p.no) +
              '</td><td>' + esc(p.tax_type) + '</td><td>' +
              (late ? '<span style="color:var(--err)">' + esc(p.due_date) + ' 逾期</span>'
                    : esc(p.due_date || '—')) +
              '</td><td class="num">' + fmtMoney(p.tax_amount) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<div class="empty">本期申报已全部完成</div>') +
      '</div></div>' +
      '<div class="grid2">' +
      '<div class="card"><h3>纳税主体概况</h3>' +
      table(['主体', '纳税人身份', '行业', '小微', '高新'],
        d.entities || [],
        function (e) {
          return '<tr><td><b>' + esc(e.name) + '</b><br><small style="color:var(--sub)">' +
            esc(e.code) + '</small></td><td>' + esc(e.taxpayer_type) + '</td><td>' +
            esc(e.industry) + '</td><td>' + (Number(e.small_profit) ? tag('是', 'ok') : '—') +
            '</td><td>' + (Number(e.high_tech) ? tag('是', 'pri') : '—') + '</td></tr>';
        }) +
      '</div>' +
      '<div class="card"><h3>风险提示<span class="sub">未处理</span></h3>' +
      ((d.risks || []).length
        ? '<div class="risk-list">' + d.risks.map(function (r) {
            return '<div class="risk-item ' + (r.level === '险' ? 'lv-hi' : 'lv-mid') + '">' +
              '<div class="h">' + levelTag(r.level) + '<b>' + esc(r.title) + '</b></div>' +
              '<div class="d">' + esc(r.entity) + ' · ' + esc(r.status) + '</div></div>';
          }).join('') + '</div>'
        : '<div class="empty">暂无未处理风险</div>') +
      '</div></div>' +
      '<div class="card"><h3>通知公告</h3>' +
      (list.length
        ? '<div class="tl">' + list.map(function (n) {
            return '<div class="tl-item' + (n.top ? ' pass' : '') + '">' +
              '<div class="t">' + esc(fmtDate(n.created_at)) + ' · ' + esc(n.author) + '</div>' +
              '<div class="h">' + esc(n.title) + (n.top ? ' ' + tag('置顶', 'pri') : '') + '</div>' +
              '<div class="d">' + esc(String(n.body || '').slice(0, 90)) + '</div></div>';
          }).join('') + '</div>'
        : '<div class="empty">暂无公告</div>') +
      '</div>';

    el.querySelectorAll('tr[data-no]').forEach(function (tr) {
      tr.onclick = function () { location.hash = '#/declare'; };
    });
  });
};

/* ==================================================== 发票管理 */
PAGES.invoice = function (el) {
  var st = {kind: '销项', period: '', entity: '', kw: '', page: 1, size: 20};
  el.innerHTML = pageHead('发票管理', '销项开票与进项收票台账，支持三流一致校验',
    '<button class="btn" id="new-inv">+ 新增发票</button>' +
    '<button class="btn ghost" id="exp-inv">导出 CSV</button>');

  var filter = document.createElement('div');
  filter.className = 'card';
  filter.innerHTML = '<div class="toolbar" style="margin:0">' +
    '<select id="f-kind"><option>销项</option><option>进项</option><option value="">全部</option></select>' +
    '<select id="f-period"><option value="">全部期间</option>' + periodOptions('') + '</select>' +
    '<select id="f-entity"><option value="">全部主体</option></select>' +
    '<input id="f-kw" placeholder="发票号 / 销方 / 购方" style="width:200px">' +
    '<button class="btn sm" id="f-go">查询</button>' +
    '<span id="f-sum" style="margin-left:auto;color:var(--sub);font-size:12.5px"></span>' +
    '</div>';
  el.appendChild(filter);

  var box = document.createElement('div');
  box.className = 'card';
  el.appendChild(box);

  GET('/api/entities').then(function (r) {
    var ents = (r.data || {}).list || [];
    var sel = filter.querySelector('#f-entity');
    ents.forEach(function (e) {
      sel.insertAdjacentHTML('beforeend',
        '<option value="' + e.code + '">' + esc(e.name) + '</option>');
    });
  }).catch(function () {});

  function load() {
    var q = '/api/invoices?kind=' + encodeURIComponent(st.kind) +
      (st.period ? '&period=' + st.period : '') +
      (st.entity ? '&entity=' + st.entity : '') +
      (st.kw ? '&kw=' + encodeURIComponent(st.kw) : '');
    box.innerHTML = '<div class="empty">加载中…</div>';
    GET(q).then(function (r) {
      var d = r.data || {}, rows = d.list || [];
      filter.querySelector('#f-sum').textContent =
        '共 ' + (d.total || 0) + ' 张 · 金额 ' + fmtMoney(d.sumAmount) +
        ' · 税额 ' + fmtMoney(d.sumTax);
      var all = rows;
      var pages = Math.max(1, Math.ceil(all.length / st.size));
      if (st.page > pages) st.page = pages;
      var cur = all.slice((st.page - 1) * st.size, st.page * st.size);
      box.innerHTML = '<h3>发票列表<span class="sub">' + esc(st.kind || '全部') +
        ' · 第 ' + st.page + '/' + pages + ' 页</span></h3>' +
        table(['发票号', '票种', '主体', '销方', '购方', '~金额', '税率', '~税额',
               '开票日期', '状态', '认证'],
          cur,
          function (v) {
            return '<tr class="click" data-no="' + esc(v.no) + '"><td><b>' + esc(v.no) +
              '</b><br><small style="color:var(--sub)">' + esc(v.number || '') + '</small></td>' +
              '<td>' + esc(v.invoice_type) + '</td><td>' + esc(v.entity) + '</td>' +
              '<td class="wrap">' + esc(v.seller_name) + '</td>' +
              '<td class="wrap">' + esc(v.buyer_name) + '</td>' +
              '<td class="num">' + fmtMoney(v.amount) + '</td>' +
              '<td>' + esc(v.tax_rate) + '</td>' +
              '<td class="num">' + fmtMoney(v.tax) + '</td>' +
              '<td>' + esc(fmtDate(v.biz_date)) + '</td>' +
              '<td>' + statusTag(v.status) + '</td>' +
              '<td>' + statusTag(v.verify_status) + '</td></tr>';
          }) +
        '<div class="toolbar" style="margin-top:10px">' +
        '<button class="btn sm ghost" id="pg-prev"' + (st.page <= 1 ? ' disabled' : '') +
        '>上一页</button><button class="btn sm ghost" id="pg-next"' +
        (st.page >= pages ? ' disabled' : '') + '>下一页</button></div>';
      box.querySelectorAll('tr[data-no]').forEach(function (tr) {
        tr.onclick = function () { showInvoice(tr.getAttribute('data-no')); };
      });
      var pv = box.querySelector('#pg-prev'), nx = box.querySelector('#pg-next');
      if (pv) pv.onclick = function () { st.page--; load(); };
      if (nx) nx.onclick = function () { st.page++; load(); };
    }).catch(function (e) {
      box.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    });
  }

  filter.querySelector('#f-go').onclick = function () {
    st.kind = filter.querySelector('#f-kind').value;
    st.period = filter.querySelector('#f-period').value;
    st.entity = filter.querySelector('#f-entity').value;
    st.kw = filter.querySelector('#f-kw').value.trim();
    st.page = 1;
    load();
  };
  filter.querySelector('#f-kw').onkeydown = function (e) {
    if (e.key === 'Enter') filter.querySelector('#f-go').click();
  };
  el.querySelector('#exp-inv').onclick = function () {
    dl('/api/reports/export?type=invoice' + (st.period ? '&period=' + st.period : ''),
       '发票台账_' + (st.period || '全部') + '.csv');
  };
  el.querySelector('#new-inv').onclick = function () { editInvoice(null, load); };
  load();
};

function showInvoice(no) {
  GET('/api/invoices/' + encodeURIComponent(no)).then(function (r) {
    var v = r.data || {};
    var risks = v.risks || [];
    var tf = v.three_flow;
    modal('<h3>发票详情 · ' + esc(v.no) + '</h3>' +
      '<div class="grid2">' +
      field('发票种类', '<input value="' + esc(v.invoice_type) + '" disabled>') +
      field('所属主体', '<input value="' + esc(v.entity + ' ' + (v.entity_name || '')) + '" disabled>') +
      field('开票日期', '<input value="' + esc(v.biz_date) + '" disabled>') +
      field('所属期间', '<input value="' + esc(v.period) + '" disabled>') +
      field('金额（不含税）', '<input value="' + fmtMoney(v.amount, true) + '" disabled>') +
      field('税率', '<input value="' + esc(v.tax_rate) + '" disabled>') +
      field('税额', '<input value="' + fmtMoney(v.tax, true) + '" disabled>') +
      field('价税合计', '<input value="' + fmtMoney(v.total, true) + '" disabled>') +
      field('销售方', '<input value="' + esc(v.seller_name) + '" disabled>') +
      field('购买方', '<input value="' + esc(v.buyer_name) + '" disabled>') +
      '</div>' +
      '<div style="margin-top:6px">' +
      '<b style="font-size:13px">三流一致校验</b>' +
      (tf

          (tf.ok ? tag('合同流 / 发票流 / 资金流 一致', 'ok')
                 : (tf.issues || []).map(function (i) { return tag(i, 'err'); }).join(' ')) +
          '</div>'
        : '<div style="margin-top:6px;color:var(--sub);font-size:12.5px">' +
          '未关联合同，无法校验合同流</div>') +
      '</div>' +
      '<div style="margin-top:12px"><b style="font-size:13px">风险提示</b>' +
      (risks.length
        ? '<div class="risk-list" style="margin-top:6px">' + risks.map(function (x) {
            return '<div class="risk-item ' +
              (x.level === '险' ? 'lv-hi' : (x.level === '警' ? 'lv-mid' : 'lv-lo')) + '">' +
              '<div class="h">' + levelTag(x.level) + '<b>' + esc(x.title || x.code) + '</b></div>' +
              (x.detail ? '<div class="d">' + esc(x.detail) + '</div>' : '') + '</div>';
          }).join('') + '</div>'
        : '<div style="margin-top:6px;color:var(--ok);font-size:12.5px">未发现风险</div>') +
      '</div>' +
      '<div class="acts">' +
      (perm('invoice.void') && v.status === '正常'
        ? '<button class="btn danger sm" id="m-void">作废</button>' : '') +
      '<button class="btn ghost" onclick="closeModal()">关闭</button></div>', true);

    var vb = document.getElementById('m-void');
    if (vb) vb.onclick = function () {
      if (!confirm('确认作废发票 ' + v.no + '？')) return;
      POST('/api/invoices/' + encodeURIComponent(v.no) + '/void', {reason: '手工作废'})
        .then(function () { toast('已作废'); closeModal(); go('invoice'); })
        .catch(function (e) { toast(e.message, true); });
    };
  }).catch(function (e) { toast(e.message, true); });
}

function editInvoice(v, done) {
  GET('/api/entities').then(function (r) {
    var ents = (r.data || {}).list || [];
    modal('<h3>' + (v ? '编辑发票' : '新增发票') + '</h3>' +
      '<div class="grid2">' +
      field('类型', '<select id="i-kind"><option>销项</option><option>进项</option></select>') +
      field('纳税主体', '<select id="i-entity">' + ents.map(function (e) {
        return '<option value="' + e.code + '">' + esc(e.name) + '</option>';
      }).join('') + '</select>') +
      field('票种', '<select id="i-type"><option>增值税专用发票</option>' +
        '<option>增值税普通发票</option><option>电子发票</option></select>') +
      field('税率', '<select id="i-rate"><option>13%</option><option>9%</option>' +
        '<option>6%</option><option>0%</option><option>3%</option><option>1%</option></select>') +
      field('金额', '<input id="i-amount" type="number" step="0.01" placeholder="0.00">') +
      field('含税', '<select id="i-incl"><option value="">否（金额不含税）</option>' +
        '<option value="1">是（金额为价税合计）</option></select>') +
      field('开票日期', '<input id="i-date" type="date" value="' + todayStr() + '">') +
      field('对方名称', '<input id="i-name" placeholder="销方或购方">') +
      '</div>' +
      field('备注', '<input id="i-memo">') +
      '<div class="acts"><button class="btn ghost" onclick="closeModal()">取消</button>' +
      '<button class="btn" id="i-save">保存</button></div>');

    document.getElementById('i-save').onclick = function () {
      var b = {
        kind: document.getElementById('i-kind').value,
        entity: document.getElementById('i-entity').value,
        invoice_type: document.getElementById('i-type').value,
        rate: document.getElementById('i-rate').value,
        amount: document.getElementById('i-amount').value,
        inclusive: !!document.getElementById('i-incl').value,
        biz_date: document.getElementById('i-date').value,
        remark: document.getElementById('i-memo').value
      };
      var nm = document.getElementById('i-name').value.trim();
      if (b.kind === '销项') b.buyer_name = nm; else b.seller_name = nm;

  }).catch(function (e) { toast(e.message, true); });
}

      var d = rs[0].data || {}, inv = (rs[1].data || {}).list || [];
      var byRate = d.byRate || [], byVerify = d.byVerify || [], bySup = d.bySupplier || [];

          return '<tr><td>' + statusTag(r.status) + '</td><td>' + r.cnt +
            '</td><td class="num">' + fmtMoney(r.tax) + '</td></tr>';
        }) + '</div></div>' +

              '<td>' + esc(fmtDate(r.biz_date)) + '</td>' +

              '<td>' + (can && perm('input.verify')

              '</td></tr>';

      box.querySelectorAll('[data-cert]').forEach(function (b) {

  f.className = 'card';
  f.innerHTML = '<div class="toolbar" style="margin:0">' +
    '<select id="d-period"><option value="">全部期间</option>' + periodOptions('') + '</select>' +
    '<select id="d-entity"><option value="">全部主体</option></select>' +
    '<select id="d-status"><option value="">全部状态</option><option>草稿</option>' +
    '<option>待申报</option><option>已申报</option><option>已缴款</option></select>' +

  el.appendChild(f);

  var box = document.createElement('div');
  box.className = 'card';
  el.appendChild(box);

  GET('/api/entities').then(function (r) {
    ((r.data || {}).list || []).forEach(function (e) {
      f.querySelector('#d-entity').insertAdjacentHTML('beforeend',
        '<option value="' + e.code + '">' + esc(e.name) + '</option>');
    });
  }).catch(function () {});

  function load() {
    var q = '/api/declarations?' + (st.period ? 'period=' + st.period + '&' : '') +
      (st.entity ? 'entity=' + st.entity + '&' : '') +
      (st.status ? 'status=' + encodeURIComponent(st.status) : '');
    box.innerHTML = '<div class="empty">加载中…</div>';
    GET(q).then(function (r) {
      var d = r.data || {}, rows = d.list || [];
      f.querySelector('#d-sum').textContent =
        '共 ' + (d.total || 0) + ' 单 · 应纳税额 ' + fmtMoney(d.sumTax) +
        ' · 待缴 ' + fmtMoney(d.sumUnpaid);
      box.innerHTML = '<h3>申报单列表</h3>' +
        table(['单号', '主体', '税种', '所属期', '~计税依据', '~应纳税额', '~已缴',
               '申报期限', '状态', '操作'],
          rows,
          function (v) {
            return '<tr><td><b>' + esc(v.no) + '</b></td>' +
              '<td class="wrap">' + esc(v.entity_name || v.entity) + '</td>' +
              '<td>' + esc(v.tax_type) + '</td><td>' + esc(v.period) + '</td>' +
              '<td class="num">' + fmtMoney(v.base_amount) + '</td>' +
              '<td class="num"><b>' + fmtMoney(v.tax_amount) + '</b></td>' +
              '<td class="num">' + fmtMoney(v.paid_amount) + '</td>' +
              '<td>' + (v.overdue
                ? '<span style="color:var(--err)">' + esc(v.due_date) + ' 逾期</span>'
                : esc(v.due_date || '—')) + '</td>' +
              '<td>' + statusTag(v.status) + '</td>' +
              '<td><button class="btn sm ghost" data-detail="' + esc(v.no) +
              '">详情</button>' +
              (v.status === '待申报' && perm('tax.declare')
                ? ' <button class="btn sm" data-file="' + esc(v.no) + '">申报</button>' : '') +
              (v.status === '已申报' && perm('tax.declare')
                ? ' <button class="btn sm ok" data-pay="' + esc(v.no) + '">缴款</button>' : '') +
              '</td></tr>';
          });

      box.querySelectorAll('[data-detail]').forEach(function (b) {
        b.onclick = function () { showDecl(b.getAttribute('data-detail')); };
      });
      box.querySelectorAll('[data-file]').forEach(function (b) {
        b.onclick = function () {
          var no = b.getAttribute('data-file');
          if (!confirm('确认申报 ' + no + '？')) return;
          b.disabled = true;
          POST('/api/declarations/' + encodeURIComponent(no) + '/file', {})
            .then(function () { toast('已申报 ' + no); load(); })
            .catch(function (e) { toast(e.message, true); b.disabled = false; });
        };
      });
      box.querySelectorAll('[data-pay]').forEach(function (b) {
        b.onclick = function () {
          var no = b.getAttribute('data-pay');
          var amt = prompt('缴款金额', '');

    st.period = f.querySelector('#d-period').value;
    st.entity = f.querySelector('#d-entity').value;
    st.status = f.querySelector('#d-status').value;
    load();

    dl('/api/reports/export?type=declaration' + (st.period ? '&period=' + st.period : ''),
       '纳税申报_' + (st.period || '全部') + '.csv');
  };
  el.querySelector('#new-decl').onclick = function () { newDecl(load); };
  load();
};

        inputs: [{amount: v.in_amount, rate: v.in_rate}],
        prior_credit: v.prior_credit || 0};
    }
  };

  function render() {
    var f = FORMS[cur];
    wrap.innerHTML =
      '<div class="toolbar">' + Object.keys(FORMS).map(function (k) {
        return '<button class="btn sm ' + (k === cur ? '' : 'ghost') + '" data-k="' + k + '">' +

      var ok = true;
      wrap.querySelectorAll('[data-f]').forEach(function (inp) {

        var v = inp.value;
        if (v !== '' && !isNaN(Number(v)) && inp.tagName === 'INPUT') v = Number(v);

      var payload;
      if (KEYMAP[cur]) payload = KEYMAP[cur](vals);
      else {
        payload = {kind: cur};
        Object.keys(vals).forEach(function (k) {
          if (k === 'inclusive' || k === 'quarterly' || k === 'has_realestate' ||
              k === 'halve' || k === 'small_profit' || k === 'vat_excluded') {
            payload[k] = !!vals[k];
          } else payload[k] = vals[k];
        });
        if (cur === 'vat') payload.kind = 'vat';
      }
      var out = wrap.querySelector('#c-out');
      out.innerHTML = '<h3>计算结果</h3><div class="empty">计算中…</div>';
      POST('/api/calc', payload).then(function (r) {
        var d = r.data || {};
        var main = null, keys = ['tax', 'payable', 'total', 'fee', 'amount', 'burden'];
        for (var i = 0; i < keys.length; i++) {
          if (d[keys[i]] != null && typeof d[keys[i]] !== 'object') { main = keys[i]; break; }
        }
        var html = '';
        if (main) {
          var val = d[main];
          html += '<div class="settle"><div class="row"><div><b>' +
            (main === 'burden' ? fmtPct(val) : fmtMoney(val)) + '</b><span>' +
            ({tax: '应纳税额', payable: '本期应纳', total: '合计', fee: '滞纳金',
              amount: '金额', burden: '综合税负率'}[main] || '结果') +
            '</span></div></div>' +
            (d.note ? '<div class="note">' + esc(d.note) + '</div>' : '') + '</div>';
        }
        var rows = [];
        (function walk(o, pre) {
          Object.keys(o).forEach(function (k) {
            var v = o[k];
            if (v && typeof v === 'object') {
              if (Array.isArray(v)) {
                v.forEach(function (it, i) { walk(it, pre + k + '[' + (i + 1) + '].'); });
              } else walk(v, pre + k + '.');
            } else if (k !== 'note') {
              rows.push({k: pre + k, v: v});
            }
          });
        })(d, '');
        out.innerHTML = '<h3>计算结果</h3>' + html +
          table(['字段', '值'], rows, function (x) {
            return '<tr><td>' + esc(x.k) + '</td><td class="num">' + esc(x.v) + '</td></tr>';
          });
      }).catch(function (e) {
        out.innerHTML = '<h3>计算结果</h3><div class="empty">' +
          esc(e.message) + '</div>';
      });
    };
  }
  render();
};

PAGES.risk = function (el) {
  var st = {status: '', level: ''};
  el.innerHTML = pageHead('风险预警', '基于规则引擎的税务风险扫描与处置',
    '<button class="btn" id="k-scan">重新扫描</button>');

  var f = document.createElement('div');
  f.className = 'card';
  f.innerHTML = '<div class="toolbar" style="margin:0">' +
    '<select id="k-status"><option value="">全部状态</option><option>待处理</option>' +
    '<option>已处理</option><option>已忽略</option></select>' +
    '<select id="k-level"><option value="">全部等级</option><option>险</option>' +
    '<option>警</option><option>提</option></select>' +
    '<button class="btn sm" id="k-go">筛选</button>' +
    '<span id="k-sum" style="margin-left:auto;color:var(--sub);font-size:12.5px"></span></div>';
  el.appendChild(f);

  var box = document.createElement('div');
  box.className = 'card';
  el.appendChild(box);

  function load() {
    var q = '/api/risks?' + (st.status ? 'status=' + encodeURIComponent(st.status) + '&' : '') +
      (st.level ? 'level=' + encodeURIComponent(st.level) : '');
    GET(q).then(function (r) {
      var d = r.data || {}, rows = d.list || [];
      var sc = d.openScore;
      if (sc != null && typeof sc === 'object') sc = sc.score != null ? sc.score : JSON.stringify(sc);
      f.querySelector('#k-sum').textContent =
        '共 ' + (d.total || 0) + ' 条 · 风险指数 ' + (sc == null ? '—' : sc);
      if (!rows.length) {
        box.innerHTML = '<h3>风险清单</h3><div class="empty">暂无风险记录</div>';
        return;
      }
      box.innerHTML = '<h3>风险清单<span class="sub">' + rows.length + ' 条</span></h3>' +
        '<div class="risk-list">' + rows.map(function (r) {
          var cls = r.level === '险' ? 'lv-hi' : (r.level === '警' ? 'lv-mid' : 'lv-lo');
          return '<div class="risk-item ' + cls + '">' +
            '<div class="h">' + levelTag(r.level) + '<b>' + esc(r.title) + '</b>' +
            '<span style="margin-left:auto">' + statusTag(r.status) + '</span></div>' +
            '<div class="d">' + esc(r.entity_name || r.entity) + ' · ' +
            esc(r.period) + ' · 规则 ' + esc(r.code) + ' · 权重 ' + r.weight + '</div>' +
            '<div class="d">' + esc(r.detail) + '</div>' +
            (r.status === '待处理' && perm('risk.read')
              ? '<div class="toolbar" style="margin:8px 0 0">' +
                '<input placeholder="处置说明" data-memo="' + r.id + '" style="width:240px">' +
                '<button class="btn sm" data-close="' + r.id + '">标记已处理</button>' +
                '<button class="btn sm ghost" data-ignore="' + r.id + '">忽略</button></div>'
              : '') +
            '</div>';
        }).join('') + '</div>';

      box.querySelectorAll('[data-close]').forEach(function (b) {
        b.onclick = function () { closeRisk(b.getAttribute('data-close'), '已处理', box); };
      });
      box.querySelectorAll('[data-ignore]').forEach(function (b) {
        b.onclick = function () { closeRisk(b.getAttribute('data-ignore'), '已忽略', box); };
      });
    }).catch(function (e) {
      box.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    });
  }

  function closeRisk(id, status, box) {
    var memo = box.querySelector('[data-memo="' + id + '"]');
    POST('/api/risks/' + id + '/close',
         {status: status, memo: memo ? memo.value : ''})
      .then(function () { toast('已' + status); load(); })
      .catch(function (e) { toast(e.message, true); });
  }

  f.querySelector('#k-go').onclick = function () {
    st.status = f.querySelector('#k-status').value;
    st.level = f.querySelector('#k-level').value;
    load();
  };
  el.querySelector('#k-scan').onclick = function () {
    var b = this;
    b.disabled = true; b.textContent = '扫描中…';
    POST('/api/risks/scan', {period: curPeriod()}).then(function (r) {
      toast('扫描完成，新增 ' + (((r.data || {}).created) || []).length + ' 条风险');
      b.disabled = false; b.textContent = '重新扫描';
      load();
    }).catch(function (e) {
      toast(e.message, true);
      b.disabled = false; b.textContent = '重新扫描';
    });
  };
  load();
};

/* ==================================================== 系统管理 */
PAGES.system = function (el) {
  el.innerHTML = pageHead('系统管理', '组织、用户、角色权限、税务参数与接口密钥');
  var tabs = ['组织用户', '角色权限', '税务参数', '接口密钥', '操作日志'];
  var cur = 0;
  var bar = document.createElement('div');
  bar.className = 'toolbar';
  bar.innerHTML = tabs.map(function (t, i) {
    return '<button class="btn sm ' + (i === 0 ? '' : 'ghost') + '" data-t="' + i + '">' +
      t + '</button>';
  }).join('');
  el.appendChild(bar);
  var box = document.createElement('div');
  el.appendChild(box);

  function switchTo(i) {
    cur = i;
    bar.querySelectorAll('[data-t]').forEach(function (b) {
      b.className = 'btn sm ' + (Number(b.getAttribute('data-t')) === i ? '' : 'ghost');
    });
    box.innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
    if (i === 0) {
      Promise.all([GET('/api/depts'), GET('/api/users')]).then(function (rs) {
        var depts = (rs[0].data || {}).list || [];
        var users = (rs[1].data || {}).list || [];
        box.innerHTML =
          '<div class="card"><h3>部门<span class="sub">' + depts.length + ' 个</span></h3>' +
          table(['编码', '部门', '负责人', '人数', '说明'], depts, function (d) {
            return '<tr><td>' + esc(d.code) + '</td><td><b>' + esc(d.name) +
              '</b></td><td>' + esc(d.leaderName || d.leader || '—') + '</td>' +
              '<td>' + d.headcount + '</td><td class="wrap">' + esc(d.memo || '—') +
              '</td></tr>';
          }) + '</div>' +
          '<div class="card"><h3>用户<span class="sub">' + users.length + ' 人</span></h3>' +
          table(['用户名', '姓名', '部门', '岗位', '角色', '手机', '邮箱', '状态'],
            users, function (u) {
              return '<tr><td><b>' + esc(u.username) + '</b></td><td>' + esc(u.name) +
                '</td><td>' + esc(u.deptName || u.dept) + '</td><td>' + esc(u.title) +
                '</td><td>' + tag(u.role, 'pri') + '</td><td>' + esc(u.phone) +
                '</td><td><small>' + esc(u.email) + '</small></td>' +
                '<td>' + statusTag(u.status) + '</td></tr>';
            }) + '</div>';
      }).catch(function (e) {
        box.innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
      });
    } else if (i === 1) {
      GET('/api/roles').then(function (r) {
        var list = (r.data || {}).list || [];
        box.innerHTML = '<div class="card"><h3>角色与权限</h3>' +
          table(['角色', '说明', '人数', '权限项'], list, function (x) {
            return '<tr><td><b>' + esc(x.label) + '</b><br><small style="color:var(--sub)">' +
              esc(x.code) + '</small></td><td>' + esc(x.label) + '</td><td>' + x.users +
              '</td><td class="wrap">' + (x.perms || []).map(function (p) {
                return tag(p, p === '*' ? 'err' : '');
              }).join(' ') + '</td></tr>';
          }) + '</div>';
      }).catch(function (e) {
        box.innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
      });
    } else if (i === 2) {
      GET('/api/rules').then(function (r) {
        var rules = r.data || {};
        box.innerHTML = '<div class="card"><h3>税务参数</h3>' +
          '<div class="grid2">' + Object.keys(rules).map(function (k) {
            return field(k, '<input data-rule="' + esc(k) + '" value="' +
              esc(rules[k]) + '"' + (perm('system.write') ? '' : ' disabled') + '>');
          }).join('') + '</div>' +
          (perm('system.write')
            ? '<button class="btn" id="save-rules">保存参数</button>' : '') +
          '</div>' +
          '<div class="card"><h3>说明</h3><div style="font-size:12.5px;color:var(--sub);line-height:1.9">' +
          'city_type：城建税所在地分类（市区 7% / 县城·镇 5% / 其他 1%）<br>' +
          'surtax_halve：六税两费减半开关（2023-01-01 ~ 2027-12-31）<br>' +
          'fund_exempt_sales：教育费附加免征的月销售额门槛<br>' +
          'burden_tolerance：税负率偏离行业均值的容差<br>' +
          'invoice_amount_limit：单张发票金额预警上限<br>' +
          'late_fee_rate：滞纳金按日加收比率（万分之五）<br>' +
          'declare_warn_days：申报到期前提醒天数</div></div>';

        var sb = document.getElementById('save-rules');
        if (sb) sb.onclick = function () {
          var payload = {};
          box.querySelectorAll('[data-rule]').forEach(function (inp) {
            payload[inp.getAttribute('data-rule')] = inp.value;
          });
          POST('/api/rules/save', {rules: payload}).then(function () {
            toast('已保存');
          }).catch(function (e) { toast(e.message, true); });
        };
      }).catch(function (e) {
        box.innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
      });
    } else if (i === 3) {
      GET('/api/api-keys').then(function (r) {
        var list = (r.data || {}).list || [];
        box.innerHTML = '<div class="card"><h3>接口密钥<span class="sub">' +
          list.length + ' 个</span></h3>' +
          (perm('system.write')
            ? '<div class="toolbar"><input id="k-name" placeholder="密钥名称" style="width:200px">' +
              '<select id="k-scope"><option value="read">只读</option>' +
              '<option value="write">读写</option><option value="full">全部</option></select>' +
              '<button class="btn sm" id="k-new">创建密钥</button></div>'
            : '') +
          table(['ID', '名称', '前缀', '范围', '创建人', '状态', '创建时间'], list,
            function (k) {
              return '<tr><td>' + k.id + '</td><td><b>' + esc(k.name) +
                '</b></td><td><code>' + esc(k.prefix) + '…</code></td><td>' +
                esc(k.scope) + '</td><td>' + esc(k.owner) + '</td>' +
                '<td>' + statusTag(k.status) + '</td>' +
                '<td>' + esc(fmtDate(k.created_at)) + '</td></tr>';
            }, '暂无密钥') + '</div>' +
          '<div class="card"><h3>对接说明</h3><div style="font-size:12.5px;line-height:1.9">' +
          '鉴权支持五种通道：<code>Authorization: Bearer &lt;token&gt;</code>、' +
          '<code>X-Tax-Token</code>、<code>Cookie: tax_token</code>、' +
          '<code>?token=</code>、<code>X-Tax-Key: &lt;api key&gt;</code>。<br>' +
          '写接口建议带 <code>Idempotency-Key</code> 头做幂等；' +
          '增量同步用 <code>GET /api/sync?version=invoices:3</code>。<br>' +
          '完整契约见 <a href="../api.md" target="_blank">docs/api.md</a>，' +
          '在线 OpenAPI 见 <a href="' + PREFIX + '/api/apidoc" target="_blank">/api/apidoc</a>。' +
          '</div></div>';

        var nb = document.getElementById('k-new');
        if (nb) nb.onclick = function () {
          var name = document.getElementById('k-name').value.trim();
          if (!name) { toast('请填写名称', true); return; }
          POST('/api/api-keys/create', {name: name, scope: document.getElementById('k-scope').value})
            .then(function (res) {
              var k = res.data.key;
              modal('<h3>密钥已创建</h3>' +
                '<p style="color:var(--sub);font-size:12.5px">' +
                '密钥仅显示这一次，请立即复制保存。</p>' +
                '<textarea readonly style="font-family:monospace;min-height:70px">' +
                esc(k) + '</textarea>' +
                '<div class="acts"><button class="btn ghost" id="cp">复制</button>' +
                '<button class="btn" onclick="closeModal()">完成</button></div>');
              document.getElementById('cp').onclick = function () {
                var ta = document.querySelector('#modal textarea');
                ta.select(); document.execCommand('copy');
                toast('已复制');
              };
              switchTo(3);
            }).catch(function (e) { toast(e.message, true); });
        };
      }).catch(function (e) {
        box.innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
      });
    } else {
      GET('/api/logs').then(function (r) {
        var list = (r.data || {}).list || [];
        box.innerHTML = '<div class="card"><h3>操作日志<span class="sub">最近 ' +
          list.length + ' 条</span></h3>' +
          table(['时间', '用户', '动作', '对象', '详情'], list, function (l) {
            return '<tr><td>' + esc(l.created_at) + '</td><td>' + esc(l.username) +
              '</td><td>' + esc(l.action) + '</td><td>' + esc(l.target || '—') +
              '</td><td class="wrap">' + esc(l.memo || '—') + '</td></tr>';
          }, '暂无日志') + '</div>';
      }).catch(function (e) {
        box.innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
      });
    }
  }

  bar.querySelectorAll('[data-t]').forEach(function (b) {
    b.onclick = function () { switchTo(Number(b.getAttribute('data-t'))); };
  });
  switchTo(0);
};

</script>
<script>boot();</script>
</body>
</html>
